<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Study Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Add or Update Study Group</h3>
    <hr/>
    <form th:action="@{/saveGroup}" th:object="${studyGroup}" method="POST">
        <input type="text" th:field="*{name}" class="form-control col-4 mb-4"
               placeholder="Enter Group Name" maxlength="30" required/>
        <input type="text" th:field="*{faculty}" class="form-control col-4 mb-4"
               placeholder="Enter Faculty" maxlength="100" required/>
        <input type="number" th:field="*{course}" class="form-control col-4 mb-4"
               placeholder="Enter Course" min="1" max="6" required/>
        <button type="submit" class="btn btn-primary col-2">Save</button>
        <input type="hidden" th:field="*{id}"/>
    </form>
    <hr/>
    <a th:href="@{/groups}">Back to groups</a>
</div>
</body>
</html>
